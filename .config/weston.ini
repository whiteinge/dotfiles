[libinput]
# Multi-touch trackpad added by crosvm has INPUT_PROP_BUTTONPAD, so tap-to-click is
# disabled by default. We need to force enable it here.
enable-tap=true
accel-speed=0.5

[core]
idle-time=0
xwayland=true

[shell]
panel-position=top
locking=false
# Weston's window switcher is mod+Tab, where mod defaults to super -- which
# Android's desktop mode swallows for its own shortcuts (as it does alt+Tab for
# the app switcher). The Tab key itself is hardcoded in desktop-shell/shell.c;
# only the modifier is configurable. ctrl is the least-bad remaining option.
# Note this moves ALL mod bindings: mod+K (close), mod+scroll (zoom), mod+drag.
# Cost: weston grabs ctrl+Tab globally, so Firefox/terminal tab-switching loses it.
binding-modifier=ctrl

[keyboard]
keymap_rules=evdev
keymap_layout=us
# Map Caps Lock to Ctrl (keeps original Ctrl functional)
keymap_options=caps:ctrl_modifier
repeat-rate=30
repeat-delay=300

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/xterm.png
path=/usr/bin/xterm

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/firefox.png
path=/usr/bin/firefox

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/gimp.png
path=/usr/bin/gimp

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/org.inkscape.Inkscape.png
path=/usr/bin/inkscape
